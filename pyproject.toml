[project]
name = "mpcfill-topdf"
version = "0.1.0"
description = "Automated pipeline that converts an MPCFill XML project file into a print-ready PDF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0,<12",
    "reportlab>=4.0,<5",
    "gdown>=5.0,<6",
    "requests>=2.28,<3",
    "plyer>=2.0,<3",
    "windnd>=1.0,<2; sys_platform == 'win32'",
]

[project.scripts]
mpcfill-gui = "gui.main:main"
mpcfill-cli = "cli.main:main"

[tool.setuptools]
packages = ["gui", "src", "cli"]


[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]  # allow fixture redefinition in tests
"cli/main.py" = ["E402"]  # intentional: stdout encoding must be set before imports

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.15.18",
]

